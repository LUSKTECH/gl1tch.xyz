name: ❓ Question
description: Ask a question about gl1tch.xyz
title: '[Question]: '
labels: ['question']
body:
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      placeholder: |
        - What are you trying to accomplish?
        - What have you already tried?
        - Relevant links
    validations:
      required: false

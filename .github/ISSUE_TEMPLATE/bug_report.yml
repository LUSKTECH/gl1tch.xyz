name: 🐛 Bug Report
description: Report a bug or unexpected behavior on gl1tch.xyz
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Page / URL
      placeholder: e.g. https://gl1tch.xyz/stream/toronto
    validations:
      required: false

  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: |
        - OS: macOS 14 / Windows 11 / iOS 18 / …
        - Browser: Chrome 130 / Firefox 132 / Safari 18 / …
        - Device: desktop / phone / tablet
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
    validations:
      required: false

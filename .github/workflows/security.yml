name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-secrets:
    name: Check Secrets
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    outputs:
      has-snyk: ${{ steps.snyk.outputs.defined }}
      has-semgrep: ${{ steps.semgrep.outputs.defined }}
    steps:
      - id: snyk
        env:
          TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "${TOKEN:-}" ]; then
            echo "defined=true" >> "$GITHUB_OUTPUT"
          else
            echo "defined=false" >> "$GITHUB_OUTPUT"
          fi
      - id: semgrep
        env:
          TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -n "${TOKEN:-}" ]; then
            echo "defined=true" >> "$GITHUB_OUTPUT"
          else
            echo "defined=false" >> "$GITHUB_OUTPUT"
          fi

  betterleaks:
    name: Betterleaks Secrets Scan
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - id: betterleaks
        uses: dortort/betterleaks-action@cd0b905aa4befb8f42f8b1ab98150180c9e77515 # v0.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          report-format: sarif
          fail-on-leak: 'true'

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always() && steps.betterleaks.outputs.sarif-path != ''
        with:
          sarif_file: ${{ steps.betterleaks.outputs.sarif-path }}
          category: betterleaks

  semgrep:
    name: Semgrep SAST
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run Semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -n "${SEMGREP_APP_TOKEN:-}" ]; then
            semgrep ci
          else
            semgrep scan --config p/ci --config p/typescript --config p/javascript --config p/secrets --error
          fi

  snyk:
    name: Snyk Vulnerability Scan
    needs: [check-secrets]
    if: needs.check-secrets.outputs.has-snyk == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    defaults:
      run:
        working-directory: ./site
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce # master

      - run: snyk test --severity-threshold=high --all-projects
        continue-on-error: true

  snyk-skip-notice:
    name: Snyk Skip Notice
    needs: [check-secrets]
    if: needs.check-secrets.outputs.has-snyk != 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    steps:
      - run: echo "::notice::Snyk scan skipped — SNYK_TOKEN secret is not configured."

  codeql:
    name: CodeQL
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: '/language:javascript-typescript'

name: Accessibility

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe:
    name: axe-core scan
    # Portable via the Playwright image (bundles Chromium + browser deps): runs on
    # cloud (default) or a self-hosted runner (CI_RUNNER=self-hosted) with only
    # Docker on the host. Scan uses @axe-core/playwright (no host Chrome needed).
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-jammy
    defaults:
      run:
        working-directory: ./site
    steps:
      - uses: actions/checkout@v5

      # Playwright image bundles Node 22.11; Astro needs >=22.12. Pin a
      # compatible Node (browsers still come from the image via PLAYWRIGHT_BROWSERS_PATH).
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - name: Serve dist and scan (axe via Playwright/Chromium)
        run: |
          npm i --no-save playwright@1.49.0 @axe-core/playwright@4
          npx --yes serve dist -l 4321 &
          npx --yes wait-on http://localhost:4321 --timeout 30000
          node --input-type=module - <<'EOF'
          import { chromium } from 'playwright';
          import AxeBuilder from '@axe-core/playwright';

          const paths = ["", "team", "stream/toronto", "stream/strain", "join", "thanks", "contact", "blog"];
          const browser = await chromium.launch({ args: ['--no-sandbox'] });
          let failed = false;

          for (const p of paths) {
            const url = `http://localhost:4321/${p}`;
            const page = await browser.newPage();
            await page.goto(url, { waitUntil: 'networkidle', timeout: 30000 });
            const { violations } = await new AxeBuilder({ page })
              .withTags(['wcag2a', 'wcag2aa', 'wcag21aa', 'best-practice'])
              .analyze();
            console.log(`::group::axe ${url} — ${violations.length} violation(s)`);
            for (const v of violations) {
              console.log(`  [${v.impact}] ${v.id}: ${v.help} (${v.nodes.length} node(s))`);
            }
            console.log('::endgroup::');
            if (violations.length > 0) failed = true;
            await page.close();
          }

          await browser.close();
          if (failed) {
            console.log('::error::Accessibility violations found');
            process.exit(1);
          }
          console.log('No accessibility violations found.');
          EOF

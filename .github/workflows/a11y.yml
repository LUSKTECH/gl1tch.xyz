name: Accessibility

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe:
    name: axe-core scan
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    defaults:
      run:
        working-directory: ./site
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - run: npm run build

      - name: Install matching Chrome + ChromeDriver
        run: npx --yes browser-driver-manager install chrome
        working-directory: .

      - name: Serve dist and scan
        run: |
          npx --yes serve dist -l 4321 &
          SERVE_PID=$!
          npx --yes wait-on http://localhost:4321 --timeout 30000

          for path in "" "team" "stream/toronto" "stream/strain" "join" "thanks" "contact" "blog"; do
            url="http://localhost:4321/${path}"
            echo "::group::axe ${url}"
            npx --yes @axe-core/cli "${url}" --exit --tags wcag2a,wcag2aa,wcag21aa,best-practice --exclude "iframe"
            echo "::endgroup::"
          done

          kill $SERVE_PID 2>/dev/null || true

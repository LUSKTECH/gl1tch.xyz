name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-secrets:
    name: Check Secrets
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    outputs:
      has-sonar: ${{ steps.sonar.outputs.defined }}
    steps:
      - id: sonar
        env:
          TOKEN: ${{ secrets.SONAR_TOKEN }}
          HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -n "${TOKEN:-}" ] && [ -n "${HOST_URL:-}" ]; then
            echo "defined=true" >> "$GITHUB_OUTPUT"
          else
            echo "defined=false" >> "$GITHUB_OUTPUT"
          fi

  sonarqube:
    name: SonarQube Scan
    needs: [check-secrets]
    if: needs.check-secrets.outputs.has-sonar == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - working-directory: ./site
        run: npm ci

      - working-directory: ./site
        run: npm test --if-present -- --coverage || true

      # nosemgrep: generic.secrets.security.detected-sonarqube-docs-api-key.detected-sonarqube-docs-api-key
      - uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  skip-notice:
    name: SonarQube Skip Notice
    needs: [check-secrets]
    if: needs.check-secrets.outputs.has-sonar != 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - run: echo "::notice::SonarQube scan skipped — SONAR_TOKEN secret is not configured."

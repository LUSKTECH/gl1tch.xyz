[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://embed.twitch.tv https://player.twitch.tv; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; media-src 'self' https://cdn.gl1tch.xyz; font-src 'self' data:; connect-src 'self' https://api.twitch.tv; frame-src https://player.twitch.tv https://embed.twitch.tv; frame-ancestors 'self'; base-uri 'self'; form-action 'self';"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Legacy WordPress paths → home
[[redirects]]
  from = "/wp-admin/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/wp-login.php"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/xmlrpc.php"
  to = "/"
  status = 301
  force = true

# Old CF7 form preview slug, if any external link still points there
[[redirects]]
  from = "/join-us"
  to = "/join"
  status = 301
